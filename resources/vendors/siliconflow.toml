# 硅基流动 SiliconFlow — 账户余额(CNY);国际站为 api.siliconflow.com
id       = "siliconflow"
name     = "SiliconFlow"
kind     = "balance"
color    = "#7C5CFF"
homepage = "https://cloud.siliconflow.cn"
defaultIntervalMs = 300000

[auth]
style  = "bearer"
fields = ["key"]

[[request]]
method  = "GET"
url     = "https://api.siliconflow.cn/v1/user/info"
timeoutMs = 15000

[parse]
value = { path = "data.balance" }
unit  = "CNY"
